.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:34px;text-align:left}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.box b{display:block;color:var(--ink)}.box span{color:var(--muted);font-size:15px;display:block}
.tl{list-style:none;margin:0 auto;padding:0 0 0 24px;border-left:2px solid var(--a);max-width:780px}
.tl li{position:relative;margin-bottom:28px}
.tl li:before{content:"";position:absolute;left:-32px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--a2)}
.tl h3{margin:0;font-size:21px}.tl em{font-style:normal;color:var(--a2);font-size:15px}
.tl ul{margin:10px 0 0;padding-left:20px;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tile{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;height:92px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-weight:600;transition:box-shadow .2s,border-color .2s,transform .2s}

.tile i{font-style:normal;font-size:24px}.tile s{position:absolute;right:26px;bottom:6px;color:#facc15;text-decoration:none;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;transition:border-color .2s}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tile{transition:none}}
</style>
